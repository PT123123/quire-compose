# The JNI bridge: the Kotlin shell's one door into `quire-core`.
#
# A `cdylib` because Android loads it as `libquire_bridge.so`, and an `rlib` so
# the tests here can drive the same `Session` the JVM drives — the protocol is
# testable on the host, with no emulator and no JVM in the loop.
[package]
name = "quire-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "quire_bridge"
crate-type = ["cdylib", "rlib"]

# Empty on purpose, like quire-core's: this crate is its own workspace root, so
# cargo never adopts a parent manifest it did not write.
[workspace]

[dependencies]
# The same pinned rev both existing shells carry (ADR-0094) — a rev, not a tag,
# because the core repo publishes neither tags nor releases yet.
#
# This rev carries SPEC §四十一's 回收站 (core ADR-0003) on top of the 唯一 ID (core
# ADR-0002) and the organizer's 引用 (`notes.ref_note`, core ADR-0001). Bump it only
# once that commit is on `origin`: a shell cannot build against an unpublished
# commit, so the core lands and is pushed first and the pin follows.
quire-core = { git = "https://github.com/PT123123/quire-core.git", rev = "fbfdaca7273021f3d0171e9d88df7ff7404b4f95" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
