# The JNI bridge: the Kotlin shell's one door into `quire-core`.
#
# A `cdylib` because Android loads it as `libquire_bridge.so`, and an `rlib` so
# the tests here can drive the same `Session` the JVM drives — the protocol is
# testable on the host, with no emulator and no JVM in the loop.
[package]
name = "quire-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "quire_bridge"
crate-type = ["cdylib", "rlib"]

# Empty on purpose, like quire-core's: this crate is its own workspace root, so
# cargo never adopts a parent manifest it did not write.
[workspace]

[dependencies]
# The same pinned rev both existing shells carry (ADR-0094) — a rev, not a tag,
# because the core repo publishes neither tags nor releases yet.
#
# This rev carries the organizer's **sync model** (core ADR-0004) on top of SPEC
# §四十一's 回收站 (core ADR-0003), the 唯一 ID (core ADR-0002) and the organizer's
# 引用 (`notes.ref_note`, core ADR-0001): notes and tasks are merged by their 唯一 ID
# with the row's revision as the arbiter. `SNAPSHOT_VERSION` is now 4, so this pin
# moves together with the desktop's — a device left behind refuses to sync rather
# than half-understanding. It also drops the by-hand "add by address" door
# (`Cmd::ProbeAdd`), which this shell no longer offers. Bump it only once that
# commit is on `origin`: a shell cannot build against an unpublished commit, so the
# core lands and is pushed first and the pin follows.
quire-core = { git = "https://github.com/PT123123/quire-core.git", rev = "5a6b103103d399368e93cd77df9011f050af80ea" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
