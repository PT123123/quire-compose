# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# The only ABI this app ships. The tablet it is written for is arm64, and a
# second ABI would double a cold Rust pass (~20 min) to produce an .so no device
# here would load. Other ABIs stay available as a cargo-ndk flag.
quire.abi=arm64-v8a

# The app's version, and the only place it is written. `just release-publish`
# bumps the patch here on every run; app/build.gradle.kts derives both
# versionName and versionCode from it, so a bump is the whole act of making
# Android — and Obtainium — see an update.
quire.version=0.1.1
